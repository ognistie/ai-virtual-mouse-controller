# ============================================================================
# AI Virtual Mouse Controller — Python project configuration
# ============================================================================
# Source of truth pra build, deps, tooling. requirements.txt fica como
# convivencia pra usuarios que preferem pip+venv direto.
# ============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-virtual-mouse-controller"
version = "0.2.0"
description = "Controle de cursor por gestos da mao via webcam, com holograma 3D opcional."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Guilherme Moraes Franco" }]
keywords = [
    "computer-vision",
    "gesture-recognition",
    "mediapipe",
    "mouse-control",
    "accessibility",
    "hologram",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.10.0,<5.0.0",
    "mediapipe>=0.10.18,<0.11.0",
    "pyautogui>=0.9.54,<1.0.0",
    "numpy>=1.26.0,<2.2.0",
]

[project.optional-dependencies]
# Backend ModernGL 3D para o holograma (cai pra QPainter se nao instalado).
hologram = [
    "moderngl>=5.10.0",
    "PySide6>=6.6.0",
]
# Tooling de desenvolvimento.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/ognistie/ai-virtual-mouse-controller"
Documentation = "https://ognistie.github.io/ai-virtual-mouse-controller/"
Issues = "https://github.com/ognistie/ai-virtual-mouse-controller/issues"
Discussions = "https://github.com/ognistie/ai-virtual-mouse-controller/discussions"
Changelog = "https://github.com/ognistie/ai-virtual-mouse-controller/blob/main/CHANGELOG.md"

[project.scripts]
avmc = "main:main"

# ============================================================================
# Setuptools — discover de pacotes
# ============================================================================

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["core*", "services*"]
exclude = ["tests*", "scripts*", "docs*"]

# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: requires GPU (deselect with '-m \"not gpu\"')",
    "integration: integration tests requiring full env (mediapipe etc)",
]

# ============================================================================
# Coverage
# ============================================================================

[tool.coverage.run]
source = ["core", "services"]
omit = [
    "tests/*",
    "scripts/*",
    "docs/*",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
fail_under = 60

# ============================================================================
# Ruff — lint + format unificado (substitui flake8 + black + isort)
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line-too-long (gerenciado por format)
    "B008",  # function call in default args (mediapipe/cv2 patterns)
    "SIM117", # combine with statements (legibilidade prefere split)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts em testes OK
"main.py" = ["E402"]  # imports apos configuracao

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================================
# Mypy — type checking gradual
# ============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
no_implicit_optional = true
disallow_untyped_defs = false  # gradual: nao quebramos legacy
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true  # mediapipe/pyautogui/moderngl sem stubs
exclude = [
    "docs/",
    "build/",
    "dist/",
    "tests/",
]

[[tool.mypy.overrides]]
module = ["core.hand_anchor", "core.finger_posture", "core.smoothing"]
# Modulos puros recentes — type-check rigoroso.
disallow_untyped_defs = true
disallow_incomplete_defs = true
