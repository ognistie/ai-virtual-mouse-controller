# ============================================================================
# AI Virtual Mouse Controller — Python project configuration
# ============================================================================
# Source of truth pra build, deps, tooling. requirements.txt fica como
# convivencia pra usuarios que preferem pip+venv direto.
# ============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-virtual-mouse-controller"
version = "1.1.1"
description = "Controle de cursor por gestos da mao via webcam, com holograma 3D opcional."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Guilherme Moraes Franco" }]
keywords = [
    "computer-vision",
    "gesture-recognition",
    "mediapipe",
    "mouse-control",
    "accessibility",
    "hologram",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.10.0,<5.0.0",
    # CRITICAL: mediapipe 0.10.30+ removeu mp.solutions.hands que esse
    # projeto usa. Range 0.10.18..0.10.29 garante o modulo solutions
    # presente. Quando migrarmos pro novo Task API podemos abrir esse range.
    "mediapipe>=0.10.18,<0.10.30",
    "pyautogui>=0.9.54,<1.0.0",
    "numpy>=1.26.0,<2.2.0",
    # v1.0.2: holograma vira default — usuario que roda
    # `pip install ai-virtual-mouse-controller` ja consegue ativar via tecla H
    # sem precisar do extra. Trade-off: +500MB no download.
    "moderngl>=5.10.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
# Mantido pra back-compat: quem ja usava `[hologram]` continua funcionando.
hologram = [
    "moderngl>=5.10.0",
    "PySide6>=6.6.0",
]
# Tooling de desenvolvimento.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/ognistie/ai-virtual-mouse-controller"
Documentation = "https://ognistie.github.io/ai-virtual-mouse-controller/"
Issues = "https://github.com/ognistie/ai-virtual-mouse-controller/issues"
Discussions = "https://github.com/ognistie/ai-virtual-mouse-controller/discussions"
Changelog = "https://github.com/ognistie/ai-virtual-mouse-controller/blob/main/CHANGELOG.md"

[project.scripts]
avmc = "main:main"

# ============================================================================
# Setuptools — discover de pacotes
# ============================================================================

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["core*", "services*"]
exclude = ["tests*", "scripts*", "docs*"]

# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
# Testes 'gpu' (overlay PySide6/ModernGL) precisam de display/driver real
# e podem crashar em ambientes headless. Sao pulados por default; rodar
# com `pytest --gpu` (flag definida em tests/conftest.py).
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: requires GPU (deselect with '-m \"not gpu\"')",
    "integration: integration tests requiring full env (mediapipe etc)",
]

# ============================================================================
# Coverage
# ============================================================================

[tool.coverage.run]
source = ["core", "services"]
omit = [
    "tests/*",
    "scripts/*",
    "docs/*",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
# Threshold realista para o estado atual:
# - Cobertura medida no Ubuntu/CI: ~24%
# - Cobertura medida no Windows local: ~32% (codigo Win32-only conta extra)
# Setamos 20 (4 pontos abaixo do medido em CI) pra aguentar regressao
# pequena sem quebrar o build. Quando os testes legacy de
# test_gesture_detector.py forem reescritos, a cobertura sobe naturalmente
# e podemos apertar esse valor.
fail_under = 20

# ============================================================================
# Ruff — lint + format unificado (substitui flake8 + black + isort)
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
# IMPORTANTE: lint atual aplica regras estritas SO nos modulos puros
# escritos como senior code (hand_anchor, finger_posture). Arquivos
# legacy (god classes em refactor pendente) sao excluidos do lint pra
# manter o codigo intocado conforme decisao de projeto. Quando refatorar
# os god-files, mover os arquivos novos pra fora desta lista.
extend-exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "docs",
    # Codigo legacy — sem lint ate refactor (ver docs/ARCHITECTURE.md
    # "Decisoes pendentes (debt)"). Comportamento esta correto, so falta
    # modernizacao cosmetica (typing.List -> list, etc) que entrara junto
    # do split em sub-componentes.
    "core/camera.py",
    "core/click_burst.py",
    "core/cursor_controller.py",
    "core/gesture_detector.py",
    "core/hand_mesh.py",
    "core/hand_renderer.py",
    "core/hand_tracker.py",
    "core/hologram_gl_backend.py",
    "core/hologram_overlay.py",
    "core/perf_telemetry.py",
    "core/runtime_settings.py",
    "core/smoothing.py",
    "core/ui_overlay.py",
    "core/utils.py",
    "services/virtual_mouse_service.py",
    "config.py",
    "main.py",
    "tests/",  # tests legacy seguem o mesmo principio
    "scripts/",
]

[tool.ruff.lint]
# Categorias escolhidas pra pegar BUGS reais, sem forcar modernizacao
# cosmetica do typing (typing.List -> list etc). pyupgrade (UP) fica
# desativado: estilo de typing e' decisao de projeto, nao do linter.
# Se quiser modernizar todos os imports de typing, adicione "UP" aqui
# e rode `ruff check . --fix`.
select = [
    "E",   # pycodestyle errors (syntax)
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names — bugs reais)
    "B",   # flake8-bugbear (anti-patterns que viram bug)
    "C4",  # flake8-comprehensions (perf + clareza)
    "SIM", # flake8-simplify (apenas as nao-ambiguas)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (gerenciado por format)
    "B008",   # function call in default args (mediapipe/cv2 patterns)
    "B905",   # zip sem strict= — decisao de estilo, nao bug
    "SIM117", # combine with statements (legibilidade prefere split)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================================
# Mypy — type checking gradual
# ============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
no_implicit_optional = true
disallow_untyped_defs = false  # gradual: nao quebramos legacy
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true  # mediapipe/pyautogui/moderngl sem stubs
exclude = [
    "docs/",
    "build/",
    "dist/",
    "tests/",
]

[[tool.mypy.overrides]]
module = ["core.hand_anchor"]
# Type-check rigoroso so no modulo escrito do zero com tipagem completa.
# Outros modulos puros (finger_posture, smoothing) podem subir pra strict
# quando passarem por uma rodada de cleanup de tipagem (helpers internos
# sem annotation, operadores com None implicito etc).
disallow_untyped_defs = true
disallow_incomplete_defs = true
