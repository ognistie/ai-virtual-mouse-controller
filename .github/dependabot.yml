# ============================================================================
# Dependabot — atualizacoes automaticas de dependencias via PR
# ============================================================================

version: 2
updates:
  # Python deps via pip (pyproject.toml + requirements.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # Agrupa atualizacoes patch/minor em um unico PR por categoria.
      cv-stack:
        patterns:
          - "opencv-python"
          - "mediapipe"
          - "numpy"
        update-types: [minor, patch]
      tooling:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pre-commit"
        update-types: [minor, patch]
    ignore:
      # Pinned em <0.11 porque mediapipe 0.11 removeu mp.solutions.hands
      - dependency-name: "mediapipe"
        versions: [">=0.11"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
