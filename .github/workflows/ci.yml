# ============================================================================
# CI — lint + type-check + tests em todo push/PR
# ============================================================================
# Roda em matrix Python 3.11/3.12 x Ubuntu/Windows. Mediapipe e' pesado e
# nao tem wheels pra todas as combinacoes — testes que dependem dele usam
# pytest.importorskip e sao skippados graciosamente onde ele nao instala.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.4.0"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Mypy (modulos puros)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install "mypy>=1.10.0" numpy
      - name: Mypy run
        # So nos modulos puros recentes — modulos legacy ficam fora ate
        # refactor dos god-files.
        run: |
          mypy core/hand_anchor.py core/finger_posture.py core/smoothing.py \
               core/click_burst.py core/utils.py core/perf_telemetry.py

  test:
    name: Pytest (Ubuntu / Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        # NOTA: matrix simplificada (Ubuntu + 3.11 so) ate mediapipe ter
        # wheels estaveis em Windows + Python 3.12. Quando estabilizar,
        # restaurar matrix os=[ubuntu, windows] x python=[3.11, 3.12].
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/ -v --cov=core --cov-report=term --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Twine check
        run: |
          pip install twine
          twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
